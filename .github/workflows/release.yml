name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - name: Run unit tests
        run: zig build test

      - name: Run property-based tests
        run: zig build test-pbt

  build:
    name: Build ReleaseFast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - name: Build ReleaseFast
        run: zig build -Doptimize=ReleaseFast

      - name: Build C example
        run: zig build example

  autodoc:
    name: Autodoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - name: Generate autodoc
        run: zig build docs

      - name: Upload autodoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: autodoc
          path: zig-out/docs/

  release:
    name: Create GitHub Release
    needs: [test, build, autodoc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create source tarball
        run: |
          git archive --format=tar.gz --prefix="zig-ctap2-${{ steps.version.outputs.VERSION }}/" \
            -o "zig-ctap2-${{ steps.version.outputs.VERSION }}.tar.gz" HEAD

      - name: Download autodoc artifact
        uses: actions/download-artifact@v4
        with:
          name: autodoc
          path: autodoc/

      - name: Create autodoc tarball
        run: tar czf "zig-ctap2-${{ steps.version.outputs.VERSION }}-autodoc.tar.gz" -C autodoc .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zig-ctap2-${{ steps.version.outputs.VERSION }}.tar.gz
            zig-ctap2-${{ steps.version.outputs.VERSION }}-autodoc.tar.gz
